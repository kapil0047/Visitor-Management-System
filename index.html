<!DOCTYPE html>
<html>
<head>
    <title>Visitor Management - Pyrotech</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">Visitor Management System - Pyrotech</h2>
    <div class="row mt-4">
        <div class="col-md-6">
            <h4>Visitor Check-In</h4>
            <form action="/checkin" method="POST">
                <input class="form-control mb-2" type="text" name="name" placeholder="Full Name" required>
                <input class="form-control mb-2" type="text" name="company" placeholder="Company Name" required>
                <input class="form-control mb-2" type="text" name="purpose" placeholder="Purpose of Visit" required>
                <input class="form-control mb-2" type="text" name="mobile" placeholder="Mobile Number" required>
                <button class="btn btn-success w-100">Check In</button>
            </form>
        </div>
        <div class="col-md-6">
            <h4>Visitor Check-Out</h4>
            <form action="/checkout" method="POST">
                <input class="form-control mb-2" type="text" name="mobile" placeholder="Enter Mobile Number" required>
                <button class="btn btn-danger w-100">Check Out</button>
            </form>
        </div>
    </div>
    <div class="text-center mt-4">
        <a href="/admin" class="btn btn-primary">Admin Panel</a>
    </div>
</div>
</body>
</html>
