<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Pass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f2f2f2;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
    }

    .card {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .visitor-photo {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #002855;
      margin-bottom: 15px;
    }

    .card h2 {
      color: #002855;
      margin-bottom: 20px;
    }

    .visitor-details p {
      font-size: 16px;
      margin: 6px 0;
    }

    .actions {
      margin-top: 25px;
      text-align: center;
    }

    .btn-custom {
      background-color: #002855;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      border-radius: 6px;
    }

    .btn-custom:hover {
      background-color: #003b7a;
    }

    .text-center {
      text-align: center;
    }
  </style>
</head>
<body>

<div id="pass" class="card text-center">
  <h2>Visitor Check-In Successful</h2>

  <img src="{{ photo_url }}" alt="Visitor Photo" class="visitor-photo">

  <div class="visitor-details">
    <p><strong>Name:</strong> {{ name }}</p>
    <p><strong>Check-in Time:</strong> {{ checkin_time }}</p>
    <p><strong>Status:</strong> Approved</p>
    <p><strong>Thank you for visiting Pyrotech!</strong></p>
  </div>
</div>

<div class="actions">
  <button class="btn-custom" onclick="downloadPDF()">Download PDF</button>
  <button class="btn-custom" onclick="window.print()">Print</button>
</div>

<script>
  function downloadPDF() {
    const element = document.getElementById('pass');
    html2pdf().from(element).save('Visitor_Pass.pdf');
  }
</script>

</body>
</html>
