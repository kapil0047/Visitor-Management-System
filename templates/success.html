<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Check-In Successful | Pyrotech Visit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/success.css') }}">
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <h2>Visitor Check-In Successful</h2>

      <div class="photo">
        <img src="{{ photo_url }}" alt="Visitor Photo">
      </div>

      <div class="details">
        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Check-in Time:</strong> {{ checkin_time }}</p>
        <p><strong>Status:</strong> Approved</p>
        <p><strong>Thank you for visiting <b>Pyrotech</b>!</strong></p>
      </div>

      <div class="actions">
        <a href="{{ url_for('download_pdf', filename=pdf_filename) }}" class="btn">Visitor Pass (PDF)</a>
        <a href="#" onclick="window.print()" class="btn">Print</a>
        <a href="/" class="btn">Back to Home</a>
      </div>
    </div>
  </div>
</body>
</html>
