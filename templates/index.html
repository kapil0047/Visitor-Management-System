<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Check-In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f0f4f8;
      font-family: 'Segoe UI', sans-serif;
      padding-top: 50px;
    }

    .form-container {
      background: #ffffff;
      padding: 30px 40px;
      max-width: 600px;
      margin: auto;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .form-title {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
      color: #002855;
    }

    label {
      font-weight: 500;
      margin-bottom: 5px;
    }

    .form-control, .form-select {
      margin-bottom: 15px;
    }

    .btn-primary {
      width: 100%;
      background-color: #002855;
      border-color: #002855;
    }

    .btn-primary:hover {
      background-color: #003b7a;
    }

    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }

  </style>
</head>
<body>

<div class="form-container">
  <h2 class="form-title">Visitor Check-In Form</h2>
  <form action="/checkin" method="POST" enctype="multipart/form-data">

    <label for="name">Full Name</label>
    <input type="text" class="form-control" name="name" id="name" required>

    <label for="email">Email</label>
    <input type="email" class="form-control" name="email" id="email" required>

    <label for="phone">Phone</label>
    <input type="text" class="form-control" name="phone" id="phone" required>

    <label for="employee_id">Select Employee to Meet</label>
    <select class="form-select" name="employee_id" id="employee_id" required>
      <option value="" disabled selected>Choose an Employee</option>
      {% for emp in employees %}
        <option value="{{ emp.id }}">{{ emp.name }} - {{ emp.designation }}</option>
      {% endfor %}
    </select>

    <label for="visit_reason">Reason for Visit</label>
    <input type="text" class="form-control" name="visit_reason" id="visit_reason" required>

    <label for="photo">Upload Photo</label>
    <input type="file" class="form-control" name="photo" id="photo" required>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <div class="footer-note">
    Powered by Pyrotech Visitor System
  </div>
</div>

</body>
</html>
