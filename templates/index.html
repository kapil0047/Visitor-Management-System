<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visitor Check-In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Visitor Check-In</h1>
        <form action="/checkin" method="POST" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="phone" placeholder="Phone Number" required>

            <select name="employee_id" required>
                <option value="">Select Employee to Meet</option>
                {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.name }} - {{ emp.designation }}</option>
                {% endfor %}
            </select>

            <input type="text" name="visit_reason" placeholder="Reason for Visit" required>

            <label class="file-upload">
                Upload Photo:
                <input type="file" name="photo" accept="image/*" required>
            </label>

            <button type="submit">Check-In</button>
        </form>
    </div>
</body>
</html>
