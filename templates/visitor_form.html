<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/visit.css') }}">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #d0e7ff, #f0f9ff);
      padding: 30px;
    }

    .registration-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 50px 80px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
    }

    h2 {
      text-align: center;
      color: #004a99;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .form-group label {
      font-weight: 600;
      color: #333;
    }

    .preview-container {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    video, img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #ccc;
    }

    .capture-btn {
      background: #007bff;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    .capture-btn:hover {
      background: #0056b3;
    }

    .btn-primary, .btn-success {
      border-radius: 25px;
      padding: 10px 25px;
    }

    .btn-primary {
      background-color: #0066cc;
      border: none;
    }

    .btn-success {
      background-color: #28a745;
      border: none;
    }
  </style>
</head>
<body>

  <div class="registration-card">
    <h2>Visitor Registration</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/visitor_form" enctype="multipart/form-data">
      <!-- Name -->
      <div class="form-group">
        <label>Name:</label>
        <input type="text" name="name" class="form-control" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email:</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label>Phone:</label>
        <input type="text" name="phone" class="form-control" required>
      </div>

      <!-- Purpose -->
      <div class="form-group">
        <label>Purpose of Visit:</label>
        <input type="text" name="visit_reason" class="form-control" required>
      </div>

      <!-- Employee -->
      <div class="form-group">
        <label>Employee:</label>
        <select name="employee_id" class="form-control" required>
          {% for emp in employees %}
            <option value="{{ emp.id }}">{{ emp.name }} ({{ emp.designation }})</option>
          {% endfor %}
        </select>
      </div>

      <!-- Visitor Photo -->
      <div class="form-group">
        <label><strong>Visitor Photo:</strong></label>

        <div class="preview-container">
          <video id="video" autoplay playsinline></video>
          <img id="photoPreview" style="display: none;" />
        </div>

        <!-- Capture button -->
        <button type="button" id="captureBtn" class="capture-btn">📸 Capture</button>

        <p style="text-align:center; margin:10px 0;">OR</p>

        <!-- Upload option -->
        <input type="file" id="photoUpload" name="photoUpload" accept="image/*">

        <!-- Hidden input to store base64 -->
        <input type="hidden" id="capturedPhoto" name="capturedPhoto">
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success">Register Visitor</button>
      </div>
    </form>
  </div>

  <!-- Scripts -->
  <script>
    const video = document.getElementById('video');
    const photoPreview = document.getElementById('photoPreview');
    const captureBtn = document.getElementById('captureBtn');
    const capturedPhotoInput = document.getElementById('capturedPhoto');
    const fileInput = document.getElementById('photoUpload');

    let stream;

    // Start camera
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      } catch (err) {
        console.error("Camera error:", err);
      }
    }

    // Capture photo from webcam
    captureBtn.addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

      photoPreview.src = dataUrl;
      photoPreview.style.display = 'block';
      video.style.display = 'none';
      capturedPhotoInput.value = dataUrl;

      // Stop camera
      if (stream) stream.getTracks().forEach(track => track.stop());
    });

    // File upload preview & resize
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const maxWidth = 300, maxHeight = 300;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxWidth) {
            height *= maxWidth / width;
            width = maxWidth;
          } else if (height > maxHeight) {
            width *= maxHeight / height;
            height = maxHeight;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);

          const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          photoPreview.src = resizedDataUrl;
          photoPreview.style.display = 'block';
          video.style.display = 'none';
          capturedPhotoInput.value = resizedDataUrl;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Start camera on load
    startCamera();
  </script>
</body>
</html>
