<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visitor Registration</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      font-family: "Arial", sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h2 {
      text-align: center;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
    }
    video, canvas {
      display: block;
      margin: 10px auto;
      max-width: 300px;
    }
    .btn {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Visitor Registration</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <p style= color: {{ "green" if category == "success" else "red" }};">
          {{ message }}
        </p>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" enctype="multipart/form-data">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" name="name" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" name="email" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone:</label>
      <input type="text" name="phone" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="visit_reason">Purpose of Visit:</label>
      <input type="text" name="visit_reason" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="employee_id">Employee:</label>
      <select class="form-control" id="employee_id" name="employee_id" required>
        {% for employee in employees %}
          <option value="{{ employee.id }}">{{ employee.name }} - {{ employee.designation }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>Upload Photo:</label>
      <input type="file" name="image" class="form-control-file">
    </div>

    <div class="form-group">
      <label>Or Capture with Webcam:</label><br>
      <button type="button" class="btn btn-secondary" onclick="startCamera()">Start Camera</button>
      <button type="button" class="btn btn-info" onclick="takeSnapshot()">Take Snapshot</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display: none;"></canvas>
    <input type="hidden" name="webcam_image" id="webcam_image">

    <div class="form-group text-center">
      <button type="submit" class="btn btn-success">Register Visitor</button>
    </div>
  </form>

  <script>
    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let webcamImage = document.getElementById('webcam_image');
    let stream = null;

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(s => {
          stream = s;
          video.srcObject = stream;
        })
        .catch(err => alert("Camera access denied: " + err));
    }

    function takeSnapshot() {
      if (!stream) return;
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = canvas.toDataURL('image/png');
      webcamImage.value = imageData;

      stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }
  </script>
</body>
</html>
