<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Visitor Logs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center">Admin Panel - Visitor Records</h2>
    <table class="table table-bordered mt-4">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Company</th>
                <th>Purpose</th>
                <th>Mobile</th>
                <th>Check-in</th>
                <th>Check-out</th>
            </tr>
        </thead>
        <tbody>
            {% for visitor in visitors %}
                <tr>
                    <td>{{ visitor[0] }}</td>
                    <td>{{ visitor[1] }}</td>
                    <td>{{ visitor[2] }}</td>
                    <td>{{ visitor[3] }}</td>
                    <td>{{ visitor[4] }}</td>
                    <td>{{ visitor[5] }}</td>
                    <td>{{ visitor[6] }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <div class="text-center">
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>
</div>
</body>
</html>
